name: Publish Sunny Island student trial

on:
  push:
    branches: [codex/integrated-practice-audio]
  workflow_dispatch:

concurrency:
  group: student-trial-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            public/audio/vendor
            node_modules/.cache/aipc-audio
          key: trial-audio-${{ runner.os }}-${{ hashFiles('audio-assets.json', 'scripts/setup-audio.mjs', 'package-lock.json') }}
      - run: npm test
      - run: npm run build:student-trial
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish student trial
        id: deployment
        uses: actions/deploy-pages@v4
