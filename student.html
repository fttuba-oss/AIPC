<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AIPC Student Companion" />
    <title>AIPC Student Practice Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-blue-500/20 selection:text-blue-900 min-h-screen overflow-x-hidden">
    <div id="root"><p id="aipc-startup" role="status" style="padding:24px;font-family:system-ui">Opening AIPC…</p></div>
    <script>
      window.addEventListener('error', function (event) {
        if (event.target && event.target !== window && event.target.tagName !== 'SCRIPT') return;
        var status = document.getElementById('aipc-startup');
        if (!status) return;
        status.textContent = 'AIPC could not start. Please reload, or share this message with us: ' + (event.message || 'The application files could not load.');
      }, true);
    </script>
    <script type="module" src="/src/student/main.tsx"></script>
  </body>
</html>
